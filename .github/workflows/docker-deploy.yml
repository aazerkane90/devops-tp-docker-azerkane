name: Build, Scan and Push Docker Image
on:
  push:
    branches: [ main ]
    tags: ['v*']
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  [cite_start]security-analysis: # Job 1 : Lint avec Hadolint [cite: 256-257]
    name: Security Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ./Dockerfile
          failure-threshold: warning

  [cite_start]build-and-scan: # Job 2 : Build et Scan de sécurité [cite: 258-262]
    name: Build and Security Scan
    runs-on: ubuntu-latest
    needs: security-analysis
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true # Charge l'image localement pour le scan
          tags: ${{ env.IMAGE_NAME }}:scan
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL, HIGH, MEDIUM'
      - [cite_start]name: Upload Trivy results to GitHub Security [cite: 261]
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
      - [cite_start]name: Security Gate (Fail on CRITICAL/HIGH) [cite: 262]
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          exit-code: '1' # Fait échouer le job si failles trouvées
          ignore-unfixed: true
          severity: 'CRITICAL, HIGH'

  [cite_start]push-image: # Job 3 : Publication (uniquement si sécurité OK) [cite: 263-265]
    name: Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-scan
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
